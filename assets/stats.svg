<svg xmlns="http://www.w3.org/2000/svg" width="340" height="200" viewBox="0 0 340 200" role="img" aria-label="GitHub stats">
  <style>
    text {
      font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif;
      font-variant-numeric: tabular-nums;
    }
  </style>
  <rect x="0.5" y="0.5" width="339" height="199" rx="6" fill="#00000000" stroke="#d0d7de" stroke-opacity="0.5" />

  <text x="30" y="40" fill="#006AFF" font-size="22" font-weight="600">Stats</text>
  <text x="30" y="70" fill="#417E87" font-size="14">Contributions (1y)</text>
  <text x="310" y="70" text-anchor="end" fill="#417E87" font-size="14" font-weight="600">198</text>
  <text x="30" y="95" fill="#417E87" font-size="14">Pull requests</text>
  <text x="310" y="95" text-anchor="end" fill="#417E87" font-size="14" font-weight="600">28</text>
  <text x="30" y="120" fill="#417E87" font-size="14">Issues</text>
  <text x="310" y="120" text-anchor="end" fill="#417E87" font-size="14" font-weight="600">25</text>
  <text x="30" y="145" fill="#417E87" font-size="14">Repositories</text>
  <text x="310" y="145" text-anchor="end" fill="#417E87" font-size="14" font-weight="600">3</text>
  <text x="30" y="170" fill="#417E87" font-size="14">Stars</text>
  <text x="310" y="170" text-anchor="end" fill="#417E87" font-size="14" font-weight="600">2</text>
</svg>
